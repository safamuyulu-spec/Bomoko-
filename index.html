<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="app-version" content="2026-11-13a">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bomoko">
<title>Bomoko</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#F2EFE8;--mut:#A39B8F;--g:#0F6B4F;--gl:#4CC9A0;--s:#F2A900;--line:#2A2926;--bub:#1E1E1B;--bar:#111110;--in:#5A554D;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Inter,system-ui,sans-serif}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--s);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.top{display:flex;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:1px solid var(--line);background:var(--bar)}
.logo{font:700 30px 'Space Grotesk',sans-serif;color:var(--gl);margin:0}
.big{font-size:48px}
.body{flex:1;overflow-y:auto}
.pad{padding:20px;display:flex;flex-direction:column;gap:14px}
.auth{justify-content:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;border:0;background:none;text-align:left;color:inherit}
.av{width:46px;height:46px;border-radius:50%;background:var(--s);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;color:#1F1A14;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:0}
.mut{color:var(--mut);font-size:14px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{width:100%;height:50px;border:1px solid var(--in);border-radius:12px;padding:0 14px;background:var(--bar);color:var(--ink)}
.btn{height:50px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:600;padding:0 18px}
.btn:disabled{opacity:.5}
.btn.alt{background:none;color:var(--gl)}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bar);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;height:60px;border:0;background:none;color:var(--mut);font-size:13px}
.tabs .on{color:var(--gl);font-weight:600}
.msgs{padding:14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:78%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bub);align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.b.me{background:var(--g);color:#fff;align-self:flex-end;border-radius:16px 16px 4px 16px}
.who{font-size:12px;color:var(--mut);margin:0 4px -4px}
.bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bar)}
.bar .inp{flex:1;min-width:0}
.bar .btn{flex:none}
.fab{position:absolute;right:18px;bottom:78px;width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;line-height:1}
.err{color:#FF8A80;font-size:14px;min-height:18px}
.ov{position:absolute;inset:0;background:#000;z-index:5;display:flex;flex-direction:column}
.ovb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.ovb img{max-width:100%;max-height:70%;object-fit:contain;border-radius:8px}
.txt{font-size:26px;font-weight:600;text-align:center;overflow-wrap:anywhere;color:#fff;white-space:pre-wrap}
.cap{margin-top:12px;text-align:center}
.nav{position:absolute;top:0;bottom:0;width:50%;border:0;background:none}
.toast{z-index:9;color:var(--bg)}
textarea{font:inherit}
:root[data-theme="minuit"]{--bg:#05070F;--bar:#0D1220;--line:#1F2740;--bub:#18203A;--in:#4A5578;--g:#2F5BD3;--gl:#8FB0FF;--ink:#EAF0FF;--mut:#9AA6C4}
:root[data-theme="foret"]{--bg:#030A06;--bar:#0B1812;--line:#1B3023;--bub:#14261C;--in:#46634F;--g:#0F6B4F;--gl:#5FE0B0;--ink:#EDF7F0;--mut:#9DB3A5}
:root[data-theme="prune"]{--bg:#0A050E;--bar:#160D1C;--line:#2E1D3A;--bub:#241631;--in:#6A4E80;--g:#7A3FB0;--gl:#D3A5FF;--ink:#F5EDFB;--mut:#B3A2C2}
:root[data-theme="clair"]{--bg:#FBF7F0;--bar:#FFFFFF;--line:#DDD3C3;--bub:#EFE7D8;--in:#8A7F70;--g:#0F6B4F;--gl:#0B6B4C;--ink:#1F1A14;--mut:#6B6258;color-scheme:light}
:root[data-theme="clair"] .ov{color:#F2EFE8}
:root[data-theme="clair"] .ov .mut{color:#B8B0A4}
:root[data-theme="clair"] .ov .pad{color:var(--ink)}
:root[data-theme="clair"] .ov .pad .mut{color:var(--mut)}
:root[data-bg="points"] .body[data-chat]{background-image:radial-gradient(rgba(127,127,127,.18) 1.2px,transparent 1.4px);background-size:18px 18px}
:root[data-bg="vagues"] .body[data-chat]{background-image:repeating-linear-gradient(135deg,rgba(127,127,127,.10) 0 2px,transparent 2px 16px)}
:root[data-bg="savane"] .body[data-chat]{background-image:linear-gradient(180deg,rgba(242,169,0,.14),transparent 45%)}
:root[data-bg="nuit"] .body[data-chat]{background-image:radial-gradient(circle at 20% 10%,rgba(143,176,255,.18),transparent 45%),radial-gradient(circle at 80% 90%,rgba(122,63,176,.22),transparent 45%)}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--ink);color:#111;padding:12px 14px;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.22.2.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const $ = document.getElementById("app");
if (!window.supabase) {
  $.textContent = "Impossible de charger Bomoko. Vérifie ta connexion internet puis recharge la page.";
  throw new Error("supabase-js non chargé");
}
const sb = supabase.createClient(
  "https://jnetvzgwbogdosfpnvpq.supabase.co",
  "sb_publishable_OsXlHzL9Z8Gkw1m4nraGZg_57mHo0M5"
);
let me = null, profile = null, chan = null, poll = null;

// Petit constructeur d'éléments : le texte est toujours inséré comme texte (jamais en HTML).
function h(t, a, ...k) {
  const e = document.createElement(t);
  for (const [x, v] of Object.entries(a || {})) {
    if (x === "class") e.className = v;
    else if (x.startsWith("on")) e.addEventListener(x.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(x, v === true ? "" : v);
  }
  for (const c of k.flat()) if (c != null && c !== false) e.append(c);
  return e;
}
const show = (...n) => $.replaceChildren(...n);
let chatPend = null;
const stop = () => { if (chan) { sb.removeChannel(chan); chan = null; } clearInterval(poll); chatPend = null; };
const ini = s => (s || "?").trim().charAt(0).toUpperCase();
const av = (n, u, z) => h("div", { class: "av", style: z ? "width:" + z + "px;height:" + z + "px" + (z > 60 ? ";font-size:36px" : "") : null }, u ? h("img", { src: u, alt: "" }) : ini(n));
const fmt = d => {
  const t = new Date(d), n = new Date();
  return t.toDateString() === n.toDateString()
    ? t.toLocaleTimeString("fr", { hour: "2-digit", minute: "2-digit" })
    : t.toLocaleDateString("fr", { day: "numeric", month: "short" });
};
const toast = t => { const e = h("div", { class: "toast", role: "status" }, t); $.append(e); setTimeout(() => e.remove(), 3500); };

// ---------- Mode hors ligne, messages en attente et mises à jour ----------
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem("bk:" + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("bk:" + k, JSON.stringify(v)); } catch (e) {} },
  clear() { try { Object.keys(localStorage).filter(x => x.startsWith("bk:")).forEach(x => localStorage.removeItem(x)); } catch (e) {} }
};
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r({ data: null, error: { message: "timeout" } }), ms))]);
const netErr = e => !navigator.onLine || /fetch|network|timeout|abort|offline|load failed/i.test((e && e.message) || "");
const outbox = () => LS.get("out") || [];
let flushing = false;
async function flushOutbox() {
  if (flushing || !me || !navigator.onLine) return;
  flushing = true;
  try {
    for (const it of outbox()) {
      const { data, error } = await sb.from("messages").insert({ id: it.id, conversation_id: it.conversation_id, sender_id: me.id, body: it.body }).select().single();
      const dup = error && /duplicate|23505/i.test((error.message || "") + (error.code || ""));
      if (error && !dup) {
        if (netErr(error)) break;
        LS.set("out", outbox().filter(x => x.id !== it.id));
        if (chatPend) chatPend.done(it.id, null);
        toast("Un message n’a pas pu être envoyé (refusé).");
        continue;
      }
      LS.set("out", outbox().filter(x => x.id !== it.id));
      if (chatPend) chatPend.done(it.id, data || null);
    }
  } finally { flushing = false; }
}

// Bandeau « Hors ligne »
const netBar = h("div", { role: "status", style: "position:fixed;left:0;right:0;top:0;z-index:55;background:#7A4A00;color:#fff;text-align:center;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;font-size:13px;display:none" },
  "Hors ligne : tes messages partiront au retour du réseau.");
document.body.append(netBar);
const setNet = () => { netBar.style.display = navigator.onLine ? "none" : "block"; };
window.addEventListener("offline", setNet);
window.addEventListener("online", () => { setNet(); flushOutbox(); checkUpdate(); });
setNet();

// ---------- Badge « compte certifié » ----------
const BADGE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1D9BF0"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function badge() {
  const b = h("span", { title: "Compte certifié", role: "img", "aria-label": "Compte certifié", style: "display:inline-flex;vertical-align:middle;margin-left:4px" });
  b.innerHTML = BADGE_SVG;
  return b;
}

// Avis « nouvelle version disponible »
const APP_VERSION = (document.querySelector('meta[name="app-version"]') || {}).content;
function showUpdate() {
  if (document.getElementById("upd")) return;
  const b = h("div", { id: "upd", role: "status", style: "position:fixed;left:0;right:0;top:0;z-index:60;background:#F2A900;color:#1F1A14;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:10px;align-items:center;font-size:14px" },
    h("div", { style: "flex:1;font-weight:600" }, "Une nouvelle version de Bomoko est disponible."),
    h("button", { class: "btn", style: "height:38px;padding:0 12px;font-size:14px", onclick: applyUpdate }, "Mettre à jour"),
    h("button", { "aria-label": "Plus tard", style: "border:0;background:none;font-size:20px;color:inherit", onclick: () => b.remove() }, "✕"));
  document.body.append(b);
}
async function applyUpdate() {
  try {
    const ks = await caches.keys();
    await Promise.all(ks.map(k => caches.delete(k)));
    const rs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(rs.map(r => r.unregister()));
  } catch (e) {}
  location.reload();
}
async function checkUpdate() {
  if (!navigator.onLine || !APP_VERSION) return;
  try {
    const r = await fetch(location.pathname + "?_=" + Date.now(), { cache: "no-store", headers: { Range: "bytes=0-1500" } });
    const m = (await r.text()).match(/name="app-version" content="([^"]+)"/);
    if (m && m[1] !== APP_VERSION) showUpdate();
  } catch (e) {}
}
setTimeout(checkUpdate, 5000);
setInterval(checkUpdate, 10 * 60 * 1000);
setInterval(() => { if (navigator.onLine && outbox().length) flushOutbox(); }, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkUpdate(); flushOutbox(); } });

const fr = m =>
  /Invalid login/i.test(m) ? "E-mail ou mot de passe incorrect." :
  /already registered/i.test(m) ? "Cet e-mail a déjà un compte." :
  /at least 6/i.test(m) ? "Mot de passe : 6 caractères minimum." :
  /valid email|invalid.*email/i.test(m) ? "Adresse e-mail invalide." :
  /rate limit/i.test(m) ? "Trop d’essais. Attends un moment." :
  "Action impossible. Vérifie ta connexion internet.";

const tabs = on => h("nav", { class: "tabs" },
  h("button", { class: on === "l" ? "on" : "", onclick: listView }, "Discussions"),
  h("button", { class: on === "s" ? "on" : "", onclick: statusView }, "Statuts"),
  h("button", { class: on === "p" ? "on" : "", onclick: profView }, "Profil"));

// ---------- Connexion ----------
function authView(signup = false) {
  stop();
  const em = h("input", { class: "inp", type: "email", autocomplete: "email" });
  const pw = h("input", { class: "inp", type: "password", autocomplete: signup ? "new-password" : "current-password" });
  const nm = h("input", { class: "inp", type: "text", autocomplete: "name", maxlength: 40 });
  const err = h("div", { class: "err", role: "alert" });
  const go = h("button", { class: "btn" }, signup ? "Créer mon compte" : "Se connecter");
  go.onclick = async () => {
    err.textContent = ""; go.disabled = true;
    const e = em.value.trim(), p = pw.value;
    const r = signup
      ? await sb.auth.signUp({ email: e, password: p, options: { data: { display_name: nm.value.trim() || "Nouvel utilisateur" } } })
      : await sb.auth.signInWithPassword({ email: e, password: p });
    go.disabled = false;
    if (r.error) err.textContent = fr(r.error.message);
    else if (signup && !r.data.session) err.textContent = "Compte créé. Confirme ton e-mail, puis connecte-toi.";
  };
  show(h("div", { class: "body pad auth" },
    h("h1", { class: "logo big" }, "Bomoko"),
    h("p", { class: "mut" }, "Discute avec tes proches et crée des groupes, simplement."),
    signup && h("label", {}, "Ton nom", nm),
    h("label", {}, "E-mail", em),
    h("label", {}, "Mot de passe", pw),
    err, go,
    h("button", { class: "btn alt", onclick: () => authView(!signup) }, signup ? "J’ai déjà un compte" : "Créer un compte")));
}

async function start() {
  let { data, error: pErr } = await sb.from("profiles").select("display_name,status,avatar_url,theme,chat_bg,pro_until,verified").eq("id", me.id).single();
  if (pErr) ({ data } = await sb.from("profiles").select("display_name,status,avatar_url").eq("id", me.id).single());
  profile = data || { display_name: "" };
  applyTheme();
  if (data) { LS.set("user", { id: me.id }); LS.set("profile", profile); }
  flushOutbox();
  listenCalls();
  listView();
  const addId = new URLSearchParams(location.search).get("add");
  if (addId && UUID_RE.test(addId)) { history.replaceState(null, "", location.pathname); setTimeout(() => friendSheet(addId), 300); }
}

// ---------- Liste des discussions ----------
async function listView() {
  stop();
  const body = h("div", { class: "body" }, h("p", { class: "mut pad" }, "Chargement…"));
  show(h("div", { class: "top" }, h("h1", { class: "logo" }, "Bomoko"), h("button", { id: "fb", class: "btn alt", style: "margin-left:auto;padding:0 10px", onclick: newView }, "Amis")), body,
    h("button", { class: "fab", "aria-label": "Nouvelle discussion", onclick: newView }, "+"), tabs("l"));
  sb.from("friendships").select("id", { count: "exact", head: true }).eq("addressee_id", me.id).eq("status", "pending")
    .then(r => { const b = document.getElementById("fb"); if (b && r.count) b.textContent = "Amis (" + r.count + ")"; });
  const drawList = items => body.replaceChildren(...items.map(i => h("button", { class: "row", onclick: () => chatView(i.c, i.title, i.url) },
    av(i.title, i.url),
    h("div", { class: "grow" },
      h("div", { class: "ell", style: "font-weight:600" }, i.title, i.v ? badge() : null),
      h("div", { class: "mut ell" }, i.l ? i.l.body : "Aucun message")),
    h("div", { class: "mut", style: "font-size:12px" }, i.l ? fmt(i.l.created_at) : ""))));
  const cachedList = LS.get("list:" + me.id);
  if (cachedList && cachedList.length) drawList(cachedList);
  const { data: mine, error } = await withTimeout(sb.from("conversation_members")
    .select("conversation_id,conversations(id,is_group,name,created_at)").eq("user_id", me.id), 10000);
  if (error) { if (!(cachedList && cachedList.length)) body.replaceChildren(h("p", { class: "err pad" }, "Impossible de charger tes discussions. Vérifie ta connexion.")); return; }
  if (!mine.length) { body.replaceChildren(h("p", { class: "mut pad" }, "Aucune discussion pour le moment. Appuie sur + pour ajouter des amis et commencer à discuter.")); return; }
  const ids = mine.map(m => m.conversation_id);
  const [mem, last] = await Promise.all([
    sb.from("conversation_members").select("conversation_id,user_id,profiles(display_name,avatar_url,verified)").in("conversation_id", ids),
    sb.from("messages").select("conversation_id,body,created_at").in("conversation_id", ids).order("created_at", { ascending: false }).limit(300)
  ]);
  const lastBy = {};
  for (const m of last.data || []) if (!lastBy[m.conversation_id]) lastBy[m.conversation_id] = m;
  const items = mine.map(m => {
    const c = m.conversations;
    const other = (mem.data || []).find(x => x.conversation_id === c.id && x.user_id !== me.id);
    return { c, l: lastBy[c.id], url: c.is_group ? null : other?.profiles?.avatar_url, v: !c.is_group && !!(other?.profiles?.verified), title: c.is_group ? (c.name || "Groupe") : (other?.profiles?.display_name || "Discussion") };
  });
  items.sort((a, b) => new Date(b.l?.created_at || b.c.created_at) - new Date(a.l?.created_at || a.c.created_at));
  LS.set("list:" + me.id, items);
  drawList(items);
}

// ---------- Conversation ----------
async function chatView(c, title, url) {
  stop();
  const list = h("div", { class: "msgs" });
  const box = h("div", { class: "body", "data-chat": "1" }, list);
  const inp = h("input", { class: "inp", "aria-label": "Écrire un message", placeholder: "Écrire un message", maxlength: 4000 });
  const send = h("button", { class: "btn" }, "Envoyer");
  const sub = h("div", { class: "mut ell" });
  const tn = h("div", { class: "ell", style: "font-weight:600" }, title);
  const callBtn = k => c.is_group ? null : h("button", { class: "btn alt", "aria-label": k === "audio" ? "Appel audio" : "Appel vidéo", style: "padding:0 10px;font-size:20px", onclick: () => startCall(c, title, url, k) }, k === "audio" ? "📞" : "📹");
  show(h("div", { class: "top" },
      h("button", { class: "btn alt", "aria-label": "Retour", style: "padding:0 8px", onclick: listView }, "←"),
      av(title, url, 40),
      h("div", { style: "min-width:0;flex:1" }, tn, sub),
      callBtn("audio"), callBtn("video")),
    box, h("div", { class: "bar" },
      h("button", { class: "btn alt", "aria-label": "Joindre un fichier ou un contact", style: "padding:0 8px;font-size:22px", onclick: () => attachMenu(c, add) }, "📎"), inp, send));

  const names = {};
  const { data: mem } = await withTimeout(sb.from("conversation_members").select("user_id,profiles(display_name,status,verified)").eq("conversation_id", c.id), 6000);
  for (const m of mem || []) names[m.user_id] = m.profiles?.display_name || "";
  if (!c.is_group) sub.textContent = (mem || []).find(m => m.user_id !== me.id)?.profiles?.status || "";
  if (!c.is_group && (mem || []).find(m => m.user_id !== me.id)?.profiles?.verified) tn.append(badge());

  const seen = new Set();
  let lastAt = null;
  const els = new Map();
  const ckey = "msgs:" + c.id, hist = [], pend = new Map();
  let loaded = false;
  const showPending = it => {
    if (pend.has(it.id) || seen.has(it.id)) return;
    const b = h("div", { class: "b me", style: "opacity:.6" }, it.body, h("span", { style: "font-size:11px;margin-left:6px" }, "⏳ en attente"));
    pend.set(it.id, b); list.append(b); box.scrollTop = box.scrollHeight;
  };
  const donePending = (id, row) => { const b = pend.get(id); if (b) { b.remove(); pend.delete(id); } if (row) add(row); };
  const upd = m => {
    const hi = hist.findIndex(x => x.id === m.id);
    if (hi >= 0) { hist[hi] = m; LS.set(ckey, hist); }
    const b = els.get(m.id);
    if (!b) return;
    b.replaceChildren(m.body);
    if (m.edited_at) b.append(h("span", { style: "font-size:11px;margin-left:6px;opacity:.7" }, "modifié"));
    if (m.sender_id === me.id) b.onclick = () => editMsg(m);
  };
  const editMsg = m => {
    if (Date.now() - new Date(m.created_at) > 15 * 60 * 1000) return toast("Tu ne peux plus modifier ce message (15 minutes maximum).");
    const inp2 = h("input", { class: "inp", value: m.body, maxlength: 4000, "aria-label": "Modifier le message" });
    const sheet = h("div", { class: "ov", style: "z-index:7;justify-content:flex-end;background:rgba(0,0,0,.6)" },
      h("div", { class: "pad", style: "background:var(--bar)" },
        h("div", { style: "font-weight:600" }, "Modifier le message"), inp2,
        h("div", { style: "display:flex;gap:10px" },
          h("button", { class: "btn alt", style: "flex:1", onclick: () => sheet.remove() }, "Annuler"),
          h("button", { class: "btn", style: "flex:1", onclick: async () => {
            const t = inp2.value.trim();
            if (!t || t === m.body) return sheet.remove();
            const { data, error } = await sb.from("messages").update({ body: t }).eq("id", m.id).select().single();
            if (error) return toast("Modification impossible (15 minutes maximum).");
            sheet.remove(); upd(data);
          } }, "Enregistrer"))));
    $.append(sheet); inp2.focus();
  };
  const add = m => {
    const pb = pend.get(m.id);
    if (pb) { pb.remove(); pend.delete(m.id); }
    if (seen.has(m.id)) return;
    seen.add(m.id); lastAt = m.created_at;
    hist.push(m); if (hist.length > 60) hist.shift(); if (loaded) LS.set(ckey, hist);
    const mine = m.sender_id === me.id;
    if (c.is_group && !mine) list.append(h("div", { class: "who" }, names[m.sender_id] || "Membre"));
    if (m.media_path || m.shared_user_id) { list.append(rich(m, mine)); } else if (/^(📞|📹) Appel/.test(m.body)) {
      list.append(h("div", { class: "b" + (mine ? " me" : ""), style: "display:flex;flex-direction:column;gap:4px" }, m.body,
        h("button", { class: "btn alt", style: "height:34px;padding:0;text-align:left;color:inherit;text-decoration:underline", onclick: () => startCall(c, title, url, m.body.startsWith("📹") ? "video" : "audio") }, "Rappeler")));
    } else {
      const b = h("div", { class: "b" + (mine ? " me" : "") }, m.body);
      if (m.edited_at) b.append(h("span", { style: "font-size:11px;margin-left:6px;opacity:.7" }, "modifié"));
      if (mine) { b.style.cursor = "pointer"; b.onclick = () => editMsg(m); }
      els.set(m.id, b); list.append(b);
    }
    box.scrollTop = box.scrollHeight;
  };
  (LS.get(ckey) || []).forEach(add);   // affichage immédiat depuis le téléphone
  const { data: old, error: oldErr } = await withTimeout(sb.from("messages").select("*").eq("conversation_id", c.id)
    .order("created_at", { ascending: false }).limit(60), 10000);
  if (!oldErr && old) { list.replaceChildren(); seen.clear(); els.clear(); hist.length = 0; pend.clear(); lastAt = null; old.slice().reverse().forEach(add); }
  loaded = true; LS.set(ckey, hist);
  chatPend = { cid: c.id, show: showPending, done: donePending };
  outbox().filter(x => x.conversation_id === c.id).forEach(showPending);

  // Temps réel + vérification toutes les 8 s au cas où la connexion serait instable
  chan = sb.channel("c-" + c.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "conversation_id=eq." + c.id }, p => add(p.new))
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "messages", filter: "conversation_id=eq." + c.id }, p => upd(p.new))
    .subscribe();
  poll = setInterval(async () => {
    let q = sb.from("messages").select("*").eq("conversation_id", c.id).order("created_at");
    if (lastAt) q = q.gt("created_at", lastAt);
    const { data } = await q;
    (data || []).forEach(add);
  }, 8000);

  const doSend = async () => {
    const t = inp.value.trim();
    if (!t) return;
    inp.value = "";
    const id = crypto.randomUUID();
    let res = { error: { message: "offline" } };
    if (navigator.onLine) {
      const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 12000);
      res = await sb.from("messages").insert({ id, conversation_id: c.id, sender_id: me.id, body: t }).abortSignal(ac.signal).select().single();
      clearTimeout(tm);
    }
    if (!res.error) return add(res.data);
    if (netErr(res.error)) {
      LS.set("out", [...outbox(), { id, conversation_id: c.id, body: t, created_at: new Date().toISOString() }]);
      showPending({ id, body: t });
      toast("Hors ligne : le message partira au retour du réseau.");
    } else { inp.value = t; toast("Message non envoyé. Réessaie."); }
  };
  send.onclick = doSend;
  inp.onkeydown = e => { if (e.key === "Enter") doSend(); };
}

// ---------- Amis, demandes et groupes ----------
async function newView(mode) {
  stop();
  const grp = mode === "group";
  const q = h("input", { class: "inp", type: "search", "aria-label": "Chercher une personne", placeholder: "Chercher une personne par nom" });
  const body = h("div", { class: "body pad" });
  const sel = new Map();
  const gname = h("input", { class: "inp", "aria-label": "Nom du groupe", placeholder: "Nom du groupe", maxlength: 60 });
  const go = h("button", { class: "btn", style: "flex:1" }, "Créer le groupe");
  go.disabled = true;
  let results = [];

  const load = async () => {
    const { data, error } = await sb.from("friendships")
      .select("id,requester_id,addressee_id,status,req:profiles!requester_id(id,display_name,avatar_url,verified),adr:profiles!addressee_id(id,display_name,avatar_url,verified)")
      .or("requester_id.eq." + me.id + ",addressee_id.eq." + me.id);
    if (error) { body.replaceChildren(h("p", { class: "err" }, "Impossible de charger tes amis. Vérifie ta connexion.")); return null; }
    return data.map(f => { const sent = f.requester_id === me.id; return { id: f.id, status: f.status, dir: sent ? "sent" : "received", p: sent ? f.adr : f.req }; });
  };
  const rowEl = (p, ...acts) => h("div", { class: "row", style: "padding:10px 0" }, av(p.display_name, p.avatar_url),
    h("div", { class: "grow ell", style: "font-weight:600" }, p.display_name, p.verified ? badge() : null), ...acts);
  const sm = (t, fn, alt) => h("button", { class: "btn" + (alt ? " alt" : ""), style: "height:38px;padding:0 12px;font-size:14px", onclick: fn }, t);
  const act = async (fn, ok) => {
    const r = await fn();
    if (r && r.error) toast("Action impossible. Réessaie."); else if (ok) toast(ok);
    render();
  };
  const chatWith = async p => {
    const { data, error } = await sb.rpc("start_direct_chat", { other: p.id });
    if (error) return toast("Impossible d’ouvrir la discussion.");
    chatView({ id: data, is_group: false }, p.display_name, p.avatar_url);
  };
  const accept = r => sm("Accepter", () => act(() => sb.from("friendships").update({ status: "accepted" }).eq("id", r.id), "Ami ajouté."));
  const label = t => h("div", { class: "mut", style: "margin-top:6px" }, t);

  const render = async () => {
    const rel = await load();
    if (!rel) return;
    const by = new Map(rel.map(r => [r.p.id, r]));
    const friends = rel.filter(r => r.status === "accepted");
    const els = [];
    if (grp) {
      els.push(gname);
      if (!friends.length) els.push(h("p", { class: "mut" }, "Ajoute d’abord des amis pour créer un groupe."));
      friends.forEach(r => {
        const cb = h("input", { type: "checkbox", style: "width:22px;height:22px;accent-color:#0F6B4F", checked: sel.has(r.p.id) });
        cb.onchange = () => { cb.checked ? sel.set(r.p.id, r.p) : sel.delete(r.p.id); go.textContent = "Créer le groupe (" + sel.size + ")"; go.disabled = !sel.size; };
        els.push(h("label", { class: "row", style: "flex-direction:row;font-weight:400;font-size:16px;cursor:pointer;padding:10px 0" }, cb, av(r.p.display_name, r.p.avatar_url), r.p.display_name));
      });
    } else {
      if (results.length) {
        els.push(label("Résultats"));
        results.forEach(p => {
          const r = by.get(p.id);
          els.push(rowEl(p, !r
            ? sm("Ajouter", () => act(() => sb.from("friendships").insert({ requester_id: me.id, addressee_id: p.id }), "Demande envoyée."))
            : r.status === "accepted" ? sm("Écrire", () => chatWith(p))
            : r.dir === "sent" ? h("span", { class: "mut" }, "Demande envoyée") : accept(r)));
        });
      }
      const recv = rel.filter(r => r.status === "pending" && r.dir === "received");
      if (recv.length) {
        els.push(label("Demandes reçues"));
        recv.forEach(r => els.push(rowEl(r.p, accept(r), sm("Refuser", () => act(() => sb.from("friendships").delete().eq("id", r.id)), true))));
      }
      els.push(label("Mes amis" + (friends.length ? " (" + friends.length + ")" : "")));
      if (!friends.length) els.push(h("p", { class: "mut" }, "Pas encore d’amis. Cherche une personne par son nom, ou scanne son code QR : vous pourrez discuter dès qu’elle aura accepté ta demande."));
      friends.forEach(r => els.push(rowEl(r.p, sm("Écrire", () => chatWith(r.p)),
        sm("Retirer", () => { if (confirm("Retirer " + r.p.display_name + " de tes amis ?")) act(() => sb.from("friendships").delete().eq("id", r.id)); }, true))));
      const sent = rel.filter(r => r.status === "pending" && r.dir === "sent");
      if (sent.length) {
        els.push(label("Demandes envoyées"));
        sent.forEach(r => els.push(rowEl(r.p, sm("Annuler", () => act(() => sb.from("friendships").delete().eq("id", r.id)), true))));
      }
    }
    body.replaceChildren(...els);
  };

  let tm;
  q.oninput = () => {
    clearTimeout(tm);
    tm = setTimeout(async () => {
      const t = q.value.trim().replace(/[%,()]/g, "");
      if (t.length < 2) results = [];
      else {
        const { data } = await sb.from("profiles").select("id,display_name,avatar_url,verified").ilike("display_name", "%" + t + "%").neq("id", me.id).limit(20);
        results = data || [];
      }
      render();
    }, 300);
  };
  go.onclick = async () => {
    const name = gname.value.trim(), ids = [...sel.keys()];
    if (!name) return toast("Donne un nom au groupe.");
    go.disabled = true;
    const r = await sb.from("conversations").insert({ is_group: true, name, created_by: me.id }).select().single();
    if (r.error) { toast("Impossible de créer le groupe."); go.disabled = false; return; }
    const m = await sb.from("conversation_members").insert([me.id, ...ids].map(u => ({ conversation_id: r.data.id, user_id: u })));
    if (m.error) toast("Le groupe a été créé, mais sans tous les membres.");
    chatView(r.data, name, null);
  };

  show(...[
    h("div", { class: "top" },
      h("button", { class: "btn alt", "aria-label": "Retour", style: "padding:0 8px", onclick: listView }, "←"),
      h("div", { style: "font-weight:600;font-size:18px;flex:1" }, grp ? "Nouveau groupe" : "Amis"),
      grp ? null : h("button", { class: "btn alt", style: "padding:0 8px", onclick: scanQr }, "Scanner"),
      grp ? null : h("button", { class: "btn alt", style: "padding:0 8px", onclick: () => newView("group") }, "Groupe")),
    grp ? null : h("div", { class: "pad", style: "padding-bottom:0" }, q),
    body,
    grp ? h("div", { class: "bar" }, go) : null].filter(Boolean));
  render();
}

let cur = null, inc = null, callChan = null, callPoll = null, ringAc = null, ringTimer = null;
const seenCalls = new Set();

function ringtone(on) {
  clearInterval(ringTimer); ringTimer = null;
  if (ringAc) { try { ringAc.close(); } catch (e) {} ringAc = null; }
  if (!on) return;
  try {
    ringAc = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => {
      const o = ringAc.createOscillator(), g = ringAc.createGain();
      o.frequency.value = 440; g.gain.value = 0.15; o.connect(g); g.connect(ringAc.destination);
      o.start(); setTimeout(() => { try { o.stop(); } catch (e) {} }, 400);
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    };
    beep(); ringTimer = setInterval(beep, 1800);
  } catch (e) {}
}

async function startCall(c, title, url, kind) {
  if (cur) return toast("Tu es déjà en appel.");
  if (!window.AgoraRTC) return toast("Appels indisponibles pour le moment.");
  const { data: mem } = await sb.from("conversation_members").select("user_id").eq("conversation_id", c.id).neq("user_id", me.id).limit(1);
  const callee = mem && mem[0] && mem[0].user_id;
  if (!callee) return toast("Impossible d’appeler cette personne.");
  const { data: call, error } = await sb.from("calls").insert({ conversation_id: c.id, caller_id: me.id, callee_id: callee, kind }).select().single();
  if (error) return toast("Impossible de lancer l’appel.");
  runCall(call, title, url, true);
}

async function runCall(call, name, url, isCaller) {
  const video = call.kind === "video";
  const stat = h("div", { style: "font-size:16px;opacity:.9", role: "status" }, isCaller ? "Sonnerie…" : "Connexion…");
  const remote = h("div", { style: "position:absolute;inset:0" });
  const mid = h("div", { style: "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none" }, av(name, url, 140));
  const top = h("div", { style: "position:absolute;left:0;right:0;top:0;padding:calc(24px + env(safe-area-inset-top)) 16px 12px;text-align:center;text-shadow:0 1px 6px #000;z-index:2" },
    h("div", { class: "ell", style: "font-size:20px;font-weight:600" }, name), stat);
  const localBox = h("div", { style: "position:absolute;inset:0" });
  const flip = rb("Changer de caméra", "flip", "rgba(0,0,0,.55)", 18);
  flip.style.cssText += ";position:absolute;top:6px;right:6px;width:36px;height:36px;z-index:1";
  const local = h("div", { style: "position:absolute;right:12px;bottom:calc(112px + env(safe-area-inset-bottom));width:104px;height:150px;border-radius:14px;overflow:hidden;background:#222;z-index:2;display:none" }, localBox, flip);
  const cam = rb("Caméra", "vid"), mic = rb("Micro", "mic"), end = rb("Raccrocher", "end", "#E5253A");
  if (!video) setB(cam, false, "vid", "vidOff");
  const bar = h("div", { style: "position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:14px;padding:10px 14px;border-radius:44px;background:#1c1f1e;z-index:3" }, cam, mic, end);
  const ov = h("div", { class: "ov", role: "dialog", "aria-label": "Appel", style: "z-index:8;background:linear-gradient(#0B1F1A,#000)" }, remote, mid, top, local, bar);
  $.append(ov);

  const st = cur = { tracks: [], timers: [], client: null, rc: null, done: false, answered: false, joining: false };
  const cleanup = async (status, msg, logMissed) => {
    if (st.done) return;
    st.done = true; st.timers.forEach(t => { clearInterval(t); clearTimeout(t); });
    if (st.rc) sb.removeChannel(st.rc);
    try { st.tracks.forEach(t => { t.stop(); t.close(); }); if (st.client) await st.client.leave(); } catch (e) {}
    if (status) await sb.from("calls").update({ status, ended_at: new Date().toISOString() }).eq("id", call.id).in("status", ["ringing", "active"]);
    if (logMissed) await sb.from("messages").insert({ conversation_id: call.conversation_id, sender_id: me.id, body: video ? "📹 Appel vidéo manqué" : "📞 Appel vocal manqué" });
    ov.remove(); cur = null;
    if (msg) toast(msg);
  };
  end.onclick = () => cleanup("ended", null, isCaller && !st.answered);

  // Le décompte ne démarre que lorsque la personne appelée a décroché
  const startTimer = () => {
    if (st.answered) return;
    st.answered = true;
    const t0 = Date.now();
    const tick = () => { const sec = Math.floor((Date.now() - t0) / 1000); stat.textContent = Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); };
    tick(); st.timers.push(setInterval(tick, 1000));
  };

  let vt = null, cOn = false, camIdx = 0;
  const startCam = async () => {
    vt = await AgoraRTC.createCameraVideoTrack({ encoderConfig: "360p_1" });
    st.tracks.push(vt); vt.play(localBox); local.style.display = "block";
    await st.client.publish([vt]); cOn = true; setB(cam, true, "vid", "vidOff");
  };
  cam.onclick = async () => {
    if (!st.client) return;
    try {
      if (!vt) await startCam();
      else { cOn = !cOn; await vt.setEnabled(cOn); local.style.display = cOn ? "block" : "none"; setB(cam, cOn, "vid", "vidOff"); }
    } catch (e) { toast("Caméra indisponible. Vérifie l’autorisation."); }
  };
  flip.onclick = async () => {
    if (!vt) return;
    try {
      const cams = await AgoraRTC.getCameras();
      if (cams.length < 2) return toast("Une seule caméra détectée.");
      camIdx = (camIdx + 1) % cams.length;
      await vt.setDevice(cams[camIdx].deviceId);
    } catch (e) { toast("Changement de caméra impossible."); }
  };

  // L'appelant ne rejoint l'appel (et ne consomme des minutes) qu'après la réponse
  const join = async () => {
    try {
      const { data, error } = await sb.functions.invoke("agora-token", { body: { call_id: call.id } });
      if (error || !data || !data.token) throw new Error("jeton");
      const client = st.client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
      client.on("user-published", async (u, type) => {
        await client.subscribe(u, type);
        if (type === "video" && u.videoTrack) { u.videoTrack.play(remote); remote.style.background = "#000"; mid.style.display = "none"; }
        if (type === "audio" && u.audioTrack) u.audioTrack.play();
      });
      client.on("user-unpublished", (u, type) => { if (type === "video") { mid.style.display = "flex"; remote.style.background = "transparent"; } });
      client.on("user-left", () => cleanup("ended", "L’appel est terminé."));
      await client.join(data.appId, data.channel, data.token, data.uid);
      const mt = await AgoraRTC.createMicrophoneAudioTrack();
      st.tracks.push(mt);
      await client.publish([mt]);
      let mOn = true;
      mic.onclick = async () => { mOn = !mOn; await mt.setEnabled(mOn); setB(mic, mOn, "mic", "micOff"); };
      if (video) await startCam();
    } catch (e) {
      cleanup("ended", "Impossible de démarrer l’appel. Vérifie que le micro (et la caméra) sont autorisés.");
    }
  };
  const begin = () => { if (st.joining) return; st.joining = true; startTimer(); join(); };
  const handle = s => {
    if (s === "active" && isCaller) begin();
    else if (s === "declined") cleanup(null, "Appel refusé.");
    else if (s === "ended" || s === "missed") cleanup(null, "L’appel est terminé.");
  };
  // Suivre l'état de l'appel : réponse, refus, fin (temps réel + vérification régulière)
  st.rc = sb.channel("call-" + call.id)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "calls", filter: "id=eq." + call.id }, pl => handle(pl.new.status))
    .subscribe();
  st.timers.push(setInterval(async () => {
    const { data: r } = await sb.from("calls").select("status").eq("id", call.id).single();
    if (r) handle(r.status);
  }, 1500));
  if (isCaller) st.timers.push(setTimeout(() => { if (!st.answered) cleanup("missed", "Pas de réponse.", true); }, 40000));
  else begin();
}

async function incoming(call) {
  if (cur || inc || seenCalls.has(call.id)) return;
  seenCalls.add(call.id);
  const { data: p } = await sb.from("profiles").select("display_name,avatar_url").eq("id", call.caller_id).single();
  const name = (p && p.display_name) || "Utilisateur", url = p && p.avatar_url;
  let poll, tm;
  const close = () => { clearInterval(poll); clearTimeout(tm); ringtone(false); ov.remove(); inc = null; };

// Menu « joindre » : photo/vidéo, audio, document, contact
function attachMenu(c, add) {
  const fi = h("input", { type: "file", style: "display:none" });
  const choose = accept => { fi.accept = accept; fi.click(); };
  const opt = (t, fn) => h("button", { class: "btn alt", style: "text-align:left;font-size:17px", onclick: fn }, t);
  const sh = sheetEl(fi, opt("🖼️ Photo ou vidéo", () => choose("image/*,video/*")), opt("🎵 Audio", () => choose("audio/*")),
    opt("📄 Document", () => choose(".pdf,.doc,.docx,.xls,.xlsx,.txt")), opt("👤 Contact", () => { sh.remove(); shareContact(c, add); }));
  fi.onchange = async () => {
    const f = fi.files[0];
    if (!f) return;
    if (f.size > 25 * 1024 * 1024) return toast("Fichier trop lourd (25 Mo maximum).");
    sh.remove(); toast("Envoi en cours…");
    let blob = f, type = f.type || "application/octet-stream";
    try {
      if (type.startsWith("image/") && type !== "image/gif") { blob = await fit(f, 1600); type = "image/jpeg"; }
      const safe = f.name.replace(/[^\w.\-]+/g, "_").slice(-60);
      const path = c.id + "/" + crypto.randomUUID() + "-" + safe;
      const up = await sb.storage.from("chat-files").upload(path, blob, { contentType: type });
      if (up.error) throw up.error;
      const label = type.startsWith("image/") ? "📷 Photo" : type.startsWith("video/") ? "🎥 Vidéo" : type.startsWith("audio/") ? "🎵 Audio" : "📄 " + f.name;
      const { data, error } = await sb.from("messages").insert({ conversation_id: c.id, sender_id: me.id, body: label.slice(0, 200), media_path: path, media_type: type, media_name: f.name, media_size: f.size }).select().single();
      if (error) throw error;
      add(data);
    } catch (e) { toast("Envoi impossible. Réessaie."); }
  };
}

// Scanner le code QR d'une personne
async function scanQr() {
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices) return toast("Scanner indisponible sur ce téléphone. Scanne le code avec l’appareil photo du téléphone.");
  let stream, timer;
  const video = h("video", { playsinline: true, muted: true, autoplay: true, style: "position:absolute;inset:0;width:100%;height:100%;object-fit:cover" });
  const close = () => { clearInterval(timer); if (stream) stream.getTracks().forEach(t => t.stop()); ov.remove(); };
  const ov = h("div", { class: "ov", style: "z-index:8;background:#000" }, video,
    h("div", { style: "position:absolute;left:0;right:0;top:calc(24px + env(safe-area-inset-top));text-align:center;text-shadow:0 1px 6px #000;padding:0 16px" }, "Place le code QR d’une personne dans l’image"),
    h("button", { class: "btn", style: "position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom))", onclick: close }, "Fermer"));
  $.append(ov);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = stream; await video.play();
    const det = new BarcodeDetector({ formats: ["qr_code"] });
    timer = setInterval(async () => {
      try {
        const codes = await det.detect(video);
        if (!codes.length) return;
        const id = new URL(codes[0].rawValue).searchParams.get("add");
        if (id && UUID_RE.test(id)) { close(); friendSheet(id); }
      } catch (e) {}
    }, 400);
  } catch (e) { close(); toast("Caméra indisponible. Vérifie l’autorisation."); }
}

const COLORS = ["#0F6B4F", "#8E3B46", "#3B5BA5", "#7A4EAB", "#2F2F2C"];
async function fit(file, m) {
  const u = URL.createObjectURL(file);
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = u; });
  const k = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(u);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.8));
}

        const q = (s.kind === "text" ? s.body : (s.body || "photo")) || "";
        const m = await sb.from("messages").insert({ conversation_id: data, sender_id: me.id, body: "↩ Statut : « " + q.slice(0, 60) + (q.length > 60 ? "…" : "") + " »\n" + t });
        if (m.error) toast("Message non envoyé. Réessaie.");
        else { rin.value = ""; toast("Réponse envoyée."); }
      }
      rsend.disabled = false;
    };
    const toChat = async () => {
      const { data, error } = await sb.rpc("start_direct_chat", { other: s.author_id });
      if (error) return toast("Impossible d’ouvrir la discussion.");
      ov.remove();
      chatView({ id: data, is_group: false }, name, s.profiles?.avatar_url);
    };
    foot.append(h("div", { style: "display:flex;gap:8px;align-items:center" }, rin, rsend, lb),
      h("button", { class: "btn alt", onclick: toChat }, "Ouvrir la discussion avec " + name));
  }
}

function composeView() {
  stop();
  let kind = "text", bg = COLORS[0], file = null;
  const ta = h("textarea", { class: "inp", maxlength: 700, "aria-label": "Texte du statut", placeholder: "Écris ton statut…", style: "height:150px;padding:12px;font-size:20px;resize:none;background:" + bg });
  const sw = h("div", { style: "display:flex;gap:10px" }, COLORS.map(c => h("button", { "aria-label": "Couleur de fond " + c, style: "width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:" + c, onclick: () => { bg = c; ta.style.background = c; } })));
  const pick = h("input", { type: "file", accept: "image/*", style: "display:none" });
  const prev = h("img", { alt: "Aperçu de la photo", style: "max-width:100%;max-height:260px;border-radius:12px;display:none;align-self:center" });
  pick.onchange = () => { file = pick.files[0]; if (file) { prev.src = URL.createObjectURL(file); prev.style.display = "block"; } };
  const cap = h("input", { class: "inp", maxlength: 300, "aria-label": "Légende", placeholder: "Légende (facultatif)" });
  const photoBox = h("div", { style: "display:none;flex-direction:column;gap:10px" }, h("button", { class: "btn alt", onclick: () => pick.click() }, "Choisir une photo"), pick, prev, cap);
  const textBox = h("div", { style: "display:flex;flex-direction:column;gap:10px" }, ta, sw);
  const tK = h("button", { class: "btn", style: "flex:1" }, "Texte"), pK = h("button", { class: "btn alt", style: "flex:1" }, "Photo");
  const setKind = k => { kind = k; textBox.style.display = k === "text" ? "flex" : "none"; photoBox.style.display = k === "photo" ? "flex" : "none"; tK.className = "btn" + (k === "text" ? "" : " alt"); pK.className = "btn" + (k === "photo" ? "" : " alt"); };
  tK.onclick = () => setKind("text"); pK.onclick = () => setKind("photo");
  const aud = h("select", { class: "inp", "aria-label": "Qui peut voir ce statut ?" },
    ["contacts|Mes contacts", "everyone|Tout le monde sur Bomoko", "contacts_except|Mes contacts, sauf…", "selected|Seulement certaines personnes", "only_me|Moi seulement"]
      .map(o => h("option", { value: o.split("|")[0] }, o.split("|")[1])));
  const who = picker("Chercher les personnes"), men = picker("Mentionner des personnes");
  const whoBox = h("div", { style: "display:none;flex-direction:column;gap:8px" }, h("div", { class: "mut" }, "Choisis les personnes (exclues ou seules autorisées selon ton choix)"), who.el);
  aud.onchange = () => { whoBox.style.display = ["contacts_except", "selected"].includes(aud.value) ? "flex" : "none"; };
  const go = h("button", { class: "btn", style: "flex:1" }, "Publier");
  go.onclick = async () => {
    const a = aud.value, ids = [...who.sel.keys()], text = ta.value.trim();
    if (kind === "text" && !text) return toast("Écris quelque chose.");
    if (kind === "photo" && !file) return toast("Choisis une photo.");
    if (a === "selected" && !ids.length) return toast("Choisis au moins une personne.");
    go.disabled = true;
    try {
      const row = { author_id: me.id, kind, audience: a };
      if (kind === "text") { row.body = text; row.bg = bg; }
      else {
        const blob = await fit(file, 1280), path = me.id + "/" + crypto.randomUUID() + ".jpg";
        const up = await sb.storage.from("statuses").upload(path, blob, { contentType: "image/jpeg" });
        if (up.error) throw up.error;
        row.media_path = path; row.body = cap.value.trim() || null;
      }
      const r = await sb.from("statuses").insert(row).select().single();
      if (r.error) throw r.error;
      const extra = [];
      if (["contacts_except", "selected"].includes(a) && ids.length) extra.push(sb.from("status_audience").insert(ids.map(u => ({ status_id: r.data.id, user_id: u }))));
      if (men.sel.size) extra.push(sb.from("status_mentions").insert([...men.sel.keys()].map(u => ({ status_id: r.data.id, user_id: u }))));
      const res = await Promise.all(extra);
      if (res.some(x => x.error)) { await sb.from("statuses").delete().eq("id", r.data.id); throw new Error("public"); }
      statusView();
      toast("Statut publié.");
    } catch (e) { go.disabled = false; toast("Publication impossible. Réessaie."); }
  };
  setKind("text");
  show(h("div", { class: "top" },
      h("button", { class: "btn alt", "aria-label": "Retour", style: "padding:0 8px", onclick: statusView }, "←"),
      h("div", { style: "font-weight:600;font-size:18px" }, "Nouveau statut")),
    h("div", { class: "body pad" },
      h("div", { style: "display:flex;gap:8px" }, tK, pK), textBox, photoBox,
      h("label", {}, "Qui peut le voir ?", aud), whoBox,
      h("div", { class: "mut" }, "Mentionner (facultatif)"), men.el),
    h("div", { class: "bar" }, go));
}

// ---------- Bomoko Pro : apparence ----------
const THEMES = { noir: ["Noir", "#000", "#4CC9A0"], minuit: ["Minuit", "#05070F", "#8FB0FF"], foret: ["Forêt", "#030A06", "#5FE0B0"], prune: ["Prune", "#0A050E", "#D3A5FF"], clair: ["Clair", "#FBF7F0", "#0B6B4C"] };
const WALLS = { aucun: "Aucun", points: "Points", vagues: "Rayures", savane: "Savane", nuit: "Nuit" };
const isPro = () => !!(profile && profile.pro_until && new Date(profile.pro_until) > new Date());
function applyTheme(prevTheme, prevBg) {
  const r = document.documentElement, ok = isPro();
  r.dataset.theme = prevTheme || (ok && profile && profile.theme) || "noir";
  r.dataset.bg = prevBg || (ok && profile && profile.chat_bg) || "aucun";
}
function customizeView() {
  stop();
  const pro = isPro();
  const msg = h("div", { class: "mut", role: "status" }, pro ? "Choisis ton style." : "Aperçu libre : l’enregistrement est réservé à Bomoko Pro.");
  const pick = async (col, val) => {
    if (!pro) {
      applyTheme(col === "theme" ? val : document.documentElement.dataset.theme, col === "chat_bg" ? val : document.documentElement.dataset.bg);
      msg.textContent = "Aperçu : l’enregistrement est réservé à Bomoko Pro.";
      return;
    }
    const { error } = await sb.from("profiles").update({ [col]: val }).eq("id", me.id);
    if (error) return toast("Enregistrement impossible. Réessaie.");
    profile[col] = val; LS.set("profile", profile); applyTheme(); msg.textContent = "Style enregistré."; render();
  };
  const grid = h("div", { style: "display:flex;flex-wrap:wrap;gap:12px" });
  const grid2 = h("div", { style: "display:flex;flex-wrap:wrap;gap:8px" });
  const render = () => {
    const cur = document.documentElement.dataset;
    grid.replaceChildren(...Object.entries(THEMES).map(([k, [name, bg, ac]]) => h("button", { "aria-label": "Thème " + name, "aria-pressed": String(cur.theme === k),
      style: "width:78px;border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px", onclick: () => { pick("theme", k); render(); } },
      h("div", { style: "width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg," + bg + " 50%," + ac + " 50%);border:3px solid " + (cur.theme === k ? "var(--gl)" : "var(--in)") }), name)));
    grid2.replaceChildren(...Object.entries(WALLS).map(([k, name]) => h("button", { class: "btn" + (cur.bg === k ? "" : " alt"), "aria-pressed": String(cur.bg === k),
      style: "height:40px;padding:0 14px;font-size:14px;border:1px solid var(--in)", onclick: () => { pick("chat_bg", k); render(); } }, name)));
  };
  render();
  const back = () => { applyTheme(); profView(); };
  show(h("div", { class: "top" },
      h("button", { class: "btn alt", "aria-label": "Retour", style: "padding:0 8px", onclick: back }, "←"),
      h("div", { style: "font-weight:600;font-size:18px" }, "Apparence" + (pro ? "" : " · Pro"))),
    h("div", { class: "body pad" }, msg, h("div", { style: "font-weight:600" }, "Thème"), grid, h("div", { style: "font-weight:600;margin-top:8px" }, "Fond des discussions"), grid2));
}

// ---------- Profil ----------
async function shrink(file) {
  const u = URL.createObjectURL(file);
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = u; });
  const s = Math.min(img.width, img.height), c = document.createElement("canvas");
  c.width = c.height = 256;
  c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
  URL.revokeObjectURL(u);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
}
function profView() {
  stop();
  const nm = h("input", { class: "inp", value: profile?.display_name || "", maxlength: 40 });
  const st = h("input", { class: "inp", value: profile?.status || "", maxlength: 80, placeholder: "Ex. : Disponible" });
  const msg = h("div", { class: "mut", role: "status" });
  const pick = h("input", { type: "file", accept: "image/*", style: "display:none" });
  pick.onchange = async () => {
    const f = pick.files[0];
    if (!f) return;
    msg.textContent = "Envoi de la photo…";
    try {
      const blob = await shrink(f), path = me.id + "/avatar.jpg";
      const up = await sb.storage.from("avatars").upload(path, blob, { upsert: true, contentType: "image/jpeg" });
      if (up.error) throw up.error;
      const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
      const { error } = await sb.from("profiles").update({ avatar_url: url }).eq("id", me.id);
      if (error) throw error;
      profile.avatar_url = url;
      profView();
      toast("Photo enregistrée.");
    } catch (e) { msg.textContent = "Impossible d’envoyer la photo. Réessaie."; }
  };
  show(h("div", { class: "top" }, h("h1", { class: "logo" }, "Profil")),
    h("div", { class: "body pad" },
      h("div", { style: "align-self:center" }, av(profile?.display_name, profile?.avatar_url, 96)),
      profile?.verified ? h("div", { style: "align-self:center;display:flex;align-items:center;gap:6px;font-size:14px" }, badge(), "Compte certifié") : null,
      pick,
      h("button", { class: "btn alt", onclick: () => pick.click() }, "Changer la photo"),
      h("div", { style: "background:var(--bar);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px" },
        h("div", { style: "font-weight:600;font-size:18px" }, isPro() ? "Bomoko Pro ✓" : "Bomoko Pro"),
        h("div", { class: "mut" }, isPro() ? "Actif jusqu’au " + new Date(profile.pro_until).toLocaleDateString("fr") + "." : "Thèmes, fonds de discussion, profil professionnel et gros fichiers. Le paiement arrive bientôt."),
        h("button", { class: "btn", style: "height:44px", onclick: customizeView }, isPro() ? "Personnaliser l’apparence" : "Essayer les thèmes")),
      h("label", {}, "Ton nom", nm),
      h("label", {}, "Statut", st),
      h("button", { class: "btn", onclick: async () => {
        const v = nm.value.trim();
        if (!v) return;
        const { error } = await sb.from("profiles").update({ display_name: v, status: st.value.trim() || null }).eq("id", me.id);
        if (error) msg.textContent = "Impossible d’enregistrer.";
        else { profile.display_name = v; profile.status = st.value.trim(); msg.textContent = "Profil enregistré."; }
      } }, "Enregistrer"),
      msg,
      h("button", { class: "btn alt", onclick: showMyQr }, "Mon code QR"),
      h("button", { class: "btn alt", onclick: () => { LS.clear(); sb.auth.signOut(); } }, "Se déconnecter")),
    tabs("p"));
}

// ---------- Installation sur l'écran d'accueil ----------
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- Démarrage ----------
sb.auth.onAuthStateChange((ev, s) => {
  if (!s) {
    stopCalls();
    const u = LS.get("user");
    // Sans réseau, on ouvre l'app avec ce qui est gardé sur le téléphone
    if (!navigator.onLine && u && ev !== "SIGNED_OUT") {
      if (!me) { me = { id: u.id, offline: true }; profile = LS.get("profile") || { display_name: "" }; applyTheme(); listView(); }
      return;
    }
    me = null; profile = null; authView(); return;
  }
  if (!me || me.offline) { me = s.user; setTimeout(start, 0); }
});
